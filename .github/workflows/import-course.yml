name: Import executed course

on:
  push:
    branches: [main]
    paths: ['.course-sync/READY.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: course-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Restore the complete course package
        shell: bash
        run: |
          python - <<'PY'
          import json
          import lzma
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          staging = root / '.course-sync'
          ready = json.loads((staging / 'READY.json').read_text())
          names = ready['parts']
          if not names or len(names) != len(set(names)) or any(PurePosixPath(n).name != n for n in names):
              raise ValueError('Invalid payload part names')
          packed = b''.join((staging / n).read_bytes() for n in names)
          if len(packed) != ready['compressed_bytes']:
              raise ValueError('Payload size mismatch')
          files = json.loads(lzma.decompress(packed).decode('utf-8'))
          expected = {n['path'] for n in json.loads(files['specs/curriculum.json'])['notebooks']}
          actual = {name for name in files if name.endswith('.ipynb')}
          if actual != expected or len(actual) != 175:
              raise ValueError('Notebook paths must match all 175 curriculum entries')
          allowed_roots = {'notebooks', 'scripts', 'specs', 'reports'}
          allowed_files = {'README.md', 'COURSE_INDEX.md', 'requirements.txt', '.gitignore'}
          for name, text in files.items():
              path = PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts or not path.parts:
                  raise ValueError(f'Unsafe path: {name}')
              if path.parts[0] not in allowed_roots and name not in allowed_files:
                  raise ValueError(f'Unapproved course path: {name}')
              if not isinstance(text, str):
                  raise ValueError(f'Expected UTF-8 text: {name}')
          for name, text in files.items():
              path = root / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          print(f'Restored {len(files)} course files; fresh execution follows.')
          PY
      - name: Install the recorded Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m ipykernel install --user --name python3
      - name: Execute all 175 notebooks in fresh kernels
        run: python scripts/execute_course.py --workers 1
      - name: Audit paths, interfaces and saved outputs
        run: python scripts/audit_course.py
      - name: Publish validated notebooks and remove transfer parts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          staging = Path('.course-sync')
          ready = json.loads((staging / 'READY.json').read_text())
          for name in ready['parts'] + ['READY.json']:
              (staging / name).unlink()
          staging.rmdir()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md COURSE_INDEX.md requirements.txt .gitignore notebooks scripts specs reports .course-sync
          git commit -m 'feat: publish 175 freshly executed LeetCode course notebooks'
          git push origin HEAD:main
