name: Course rewrite validation

on:
  push:
    branches: [codex/notebook-comment-rewrite]
    paths: ['.github/workflows/course-rewrite.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked course and review files
        run: git archive --format=zip --output=review-inputs.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: course-review-inputs
          path: review-inputs.zip
          if-no-files-found: error
          retention-days: 7
